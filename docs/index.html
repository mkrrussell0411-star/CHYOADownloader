<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0a0c12" />
    <meta
      name="description"
      content="Pan and zoom large storyboard SVG exports from CHYOADownloader."
    />
    <title>Storyboard SVG viewer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600&family=Space+Grotesk:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="viewer.css" />
  </head>
  <body>
    <header class="toolbar">
      <h1 id="doc-title">Storyboard SVG viewer</h1>
      <div class="toolbar-actions">
        <label class="btn btn-primary file-label" id="open-btn">
          Open SVG
          <input type="file" id="file-input" accept=".svg,image/svg+xml" />
        </label>
        <button type="button" class="btn" id="fit-btn" title="Fit whole map on screen">
          Fit
        </button>
        <button type="button" class="btn" id="zoom-out" title="Zoom out" aria-label="Zoom out">
          −
        </button>
        <span class="zoom-readout" id="zoom-readout">—</span>
        <button type="button" class="btn" id="zoom-in" title="Zoom in" aria-label="Zoom in">
          +
        </button>
      </div>
    </header>

    <div class="viewport-wrap" id="viewport-wrap">
      <div class="viewport" id="viewport">
        <div class="viewport-inner" id="viewport-inner"></div>
        <div class="empty-state" id="empty-state">
          <div class="empty-state-card">
            <strong>Open a storyboard SVG</strong>
            <p>
              Export a map from the storyboard app, then open the
              <code>.svg</code> here—starts fully zoomed out.
            </p>
            <p class="drop-hint">Drop a file or tap <em>Open SVG</em>.</p>
            <p class="drop-hint">Wheel or pinch to zoom · drag to pan</p>
          </div>
        </div>
      </div>
      <div class="loading-overlay" id="loading" aria-live="polite">Loading…</div>
    </div>

    <script src="viewer.js?v=4"></script>
  </body>
</html>
